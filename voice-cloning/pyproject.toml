[project]
name = "siangtts"
version = "0.1.0"
description = "Thai voice-cloning TTS via LoRA fine-tuning of VoxCPM 2 on dubbing-ai/vaja-thai"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "SiangTTS" }]

dependencies = [
    "voxcpm>=2.0.3",
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "datasets>=3.0.0",
    "huggingface-hub>=0.25.0",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "pythainlp>=5.0.4",
    "bitsandbytes>=0.43.0",
    "peft>=0.13.0",
    "tensorboard>=2.17",
]

[project.optional-dependencies]
eval = [
    "transformers>=4.45",
    "jiwer>=3.0",
]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",   # FastAPI form/file uploads
    "httpx>=0.27",               # src/pipeline.py: upload + result callback
    "gradio>=5",                 # demo page (also pulled in by voxcpm)
]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[tool.uv]
package = false

# Driver 575.57 (CUDA 12.9) cannot run cu130 wheels — pin torch to cu128 builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI puts these call results in argument defaults by design (src/serve.py).
extend-immutable-calls = ["fastapi.Form", "fastapi.File", "fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:torch.*",
    "ignore::UserWarning:torchaudio.*",
]
